<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Octo </title>

  <link rel="stylesheet" href="style.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="manifest" href="manifest.json">

</head>

<body>

  <!-- LOADER -->

  <div class="loader" id="loader">

    <div class="loader-center">

      <img src="icon.png" class="loader-logo">

      <h1>OCTO</h1>

      <p>
        El sistema de tu mejor versión.
      </p>

    </div>

  </div>

  <!-- PARTICLES -->

  <div class="particles" id="particles"></div>

  <!-- APP -->

  <div class="container">

    <!-- HEADER -->

    <section class="hero glass">

      <div>

        <div class="logo-area">

          <img src="icon.png">

          <div>

            <h1>Octo</h1>

            <p class="subtitle">
              Focus-Plan-Conquer
            </p>

          </div>

        </div>

        <div class="time" id="currentTime">
          00:00
        </div>

      </div>

      <!-- PROGRESS -->

      <div class="progress-container">

        <svg width="140" height="140">

          <circle class="bg-circle" cx="70" cy="70" r="54" />

          <circle class="progress-circle" id="progressCircle" cx="70" cy="70" r="54" />

        </svg>

        <div class="progress-text" id="progressText">
          0%
        </div>

      </div>

    </section>

    <!-- QUOTE -->

    <!-- STATS -->

    <section class="stats-grid">

      <div class="stat-card glass">

        <h3 id="completedCount">
          0
        </h3>

        <p>Completadas</p>

      </div>

      <div class="stat-card glass">

        <h3 id="pendingCount">
          0
        </h3>

        <p>Pendientes</p>

      </div>

      <div class="stat-card glass">

        <h3 id="disciplineCount">
          0%
        </h3>

        <p>Disciplina</p>

      </div>

      <div class="stat-card glass">

        <h3 id="totalCount">
          0
        </h3>

        <p>Total</p>

      </div>

    </section>

    <section class="quote glass">

      <section class="stats glass">



  </div>

  <div class="stat-box">

    <h3 id="disciplinePercent">
      0%
    </h3>

    <p>
      Disciplina
    </p>

  </div>

  </section>

  <p id="quoteText">
    La disciplina construye imperios.
  </p>

  </section>

  <!-- TASKS -->

  <section class="tasks">

    <div class="task-header">

      <h2>Mis Tareas</h2>

    </div>

    <div class="task-grid" id="taskGrid"></div>

  </section>



  </div>

  <!-- FAB -->

  <button class="fab" id="addTaskBtn">

    <i class="fa-solid fa-plus"></i>

  </button>

  <!-- MODAL -->

  <div class="modal hidden" id="modal">

    <div class="modal-box glass">

      <button class="close-modal" id="closeModalBtn">
        ❌
      </button>

      <h2>Nueva tarea</h2>

      <input type="text" id="taskTitle" placeholder="Título">

      <input type="text" id="taskCategory" placeholder="Categoría">

      <input type="text" id="taskIcon" placeholder="Emoji (ej: 💪 🐶 📚 ⛽)" maxlength="2">
      <!-- TASK PRESETS -->

      <div class="preset-title">
        Tareas rápidas
      </div>

      <div class="task-presets">

        <button type="button" class="preset-btn">
          💪 Entrenar
        </button>

        <button type="button" class="preset-btn">
          📚 Estudiar
        </button>

        <button type="button" class="preset-btn">
          🐶 Pasear perro
        </button>

        <button type="button" class="preset-btn">
          ⛽ Gasolina
        </button>

        <button type="button" class="preset-btn">
          🍽️ Dar comida
        </button>

        <button type="button" class="preset-btn">
          💧 Tomar agua
        </button>

        <button type="button" class="preset-btn">
          📞 Llamada
        </button>

        <button type="button" class="preset-btn">
          🛒 Compras
        </button>

      </div>

      <!-- HOUR -->

      <input type="time" id="taskHour">

      <!-- REMINDER -->

      <select id="reminderType">

        <option value="30">
          Recordar 30 min antes
        </option>

        <option value="60">
          Recordar 1 hora antes
        </option>

        <option value="0">
          Exactamente a la hora
        </option>

      </select>

      <button id="saveTaskBtn">

        Guardar tarea

      </button>

    </div>

  </div>

  <!-- AUDIO -->

  <audio id="completeSound" src="complete.mp3"></audio>

  <audio id="legendarySound" src="legendary.mp3"></audio>

  <script src="app.js"></script>

</body>

</html>
